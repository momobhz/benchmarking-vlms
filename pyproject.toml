[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmarking-vlms"
version = "0.1.0"
description = "Config-driven VLM benchmark workflows for Robo2VLM spatial and affordance evaluation."
requires-python = ">=3.10"
dependencies = [
  "datasets",
  "numpy",
  "pillow",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
eval = [
  "torch",
  "transformers",
  "vllm",
]
analysis = [
  "matplotlib",
  "plotly",
  "scikit-learn",
  "sentence-transformers",
  "umap-learn",
]
test = [
  "pytest",
]

[project.scripts]
vlm-bench = "vlm_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
