run:
  name: gemma3_4b_spatial_zeroshot_200_t0
  output_dir: runs/eval
model:
  id: google/gemma-3-4b-it
  backend: vllm
  tensor_parallel_size: 1
  trust_remote_code: true
data:
  dataset: keplerccc/Robo2VLM-1
  split: test
  subset: spatial
  curation_results: outputs/robo2vlm_spatial_affordance/curation_results.jsonl
  max_samples: 200
prompt:
  mode: zero_shot
inference:
  temperature: 0.0
  max_tokens: 128
  batch_size: 1
image:
  mode: rgb
  depth_device: cpu
sanity_check:
  mode: none
  seed: 11
