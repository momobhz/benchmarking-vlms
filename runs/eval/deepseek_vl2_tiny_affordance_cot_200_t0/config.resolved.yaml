run:
  name: deepseek_vl2_tiny_affordance_cot_200_t0
  output_dir: runs/eval
model:
  id: deepseek-ai/deepseek-vl2-tiny
  backend: vllm
  tensor_parallel_size: 1
  trust_remote_code: true
data:
  dataset: keplerccc/Robo2VLM-1
  split: test
  subset: affordance
  curation_results: outputs/robo2vlm_spatial_affordance/curation_results.jsonl
  max_samples: 200
prompt:
  mode: cot
inference:
  temperature: 0.0
  max_tokens: 10240
  batch_size: 1
image:
  mode: rgb
  depth_device: cpu
sanity_check:
  mode: none
  seed: 11
