run:
  name: qwen25_3b_spatial_cot_rgb_depth_t0
  output_dir: runs/eval

model:
  id: Qwen/Qwen2.5-VL-3B-Instruct
  backend: vllm
  tensor_parallel_size: 1
  trust_remote_code: true

data:
  dataset: keplerccc/Robo2VLM-1
  split: test
  subset: spatial
  curation_results: outputs/robo2vlm_spatial_affordance/curation_results.jsonl
  max_samples: 100

prompt:
  mode: cot

inference:
  temperature: 0.0
  max_tokens: 10240
  batch_size: 1

image:
  mode: rgb_depth
  depth_model: depth-anything/Depth-Anything-V2-Small-hf
  depth_device: cpu

sanity_check:
  mode: none
  seed: 11
